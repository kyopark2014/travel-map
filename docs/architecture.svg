<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff9900"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00a8ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00d4aa"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#aa88ff"/>
    </marker>
  </defs>

  <rect width="920" height="600" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="460" y="34" text-anchor="middle" font-family="monospace, Courier" font-size="20" fill="white" font-weight="bold">travel-map · System Architecture</text>
  <text x="460" y="54" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">MapLibre 3D Terrain · S3 + CloudFront · Lambda HTTP API</text>

  <!-- ========== Client ========== -->
  <rect x="360" y="74" width="200" height="56" rx="8" fill="#00a8ff" fill-opacity="0.12" stroke="#00a8ff" stroke-width="1.5"/>
  <text x="460" y="96" text-anchor="middle" font-family="monospace" font-size="13" fill="#00ccff" font-weight="bold">Browser</text>
  <text x="460" y="114" text-anchor="middle" font-family="monospace" font-size="10" fill="#88ccff">MapLibre GL JS · WebGL</text>

  <!-- Arrow Browser ? CloudFront -->
  <line x1="460" y1="130" x2="460" y2="168" stroke="#00a8ff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="478" y="154" text-anchor="start" font-family="monospace" font-size="9" fill="#00a8ff">HTTPS</text>

  <!-- ========== AWS Cloud box ========== -->
  <rect x="40" y="172" width="540" height="286" rx="10" fill="#ff9900" fill-opacity="0.06" stroke="#ff9900" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="56" y="194" text-anchor="start" font-family="monospace" font-size="12" fill="#ff9900" font-weight="bold">AWS (us-west-2)</text>

  <!-- CloudFront -->
  <rect x="200" y="210" width="220" height="52" rx="8" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1.5"/>
  <text x="310" y="231" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffaa00" font-weight="bold">CloudFront</text>
  <text x="310" y="248" text-anchor="middle" font-family="monospace" font-size="9" fill="#cc9944">OAI · static CDN</text>

  <!-- Arrow CF ? S3 -->
  <line x1="310" y1="262" x2="310" y2="292" stroke="#ff9900" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="328" y="282" text-anchor="start" font-family="monospace" font-size="9" fill="#ff9900">OAI</text>

  <!-- S3 -->
  <rect x="160" y="296" width="300" height="72" rx="8" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1.5"/>
  <text x="310" y="318" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffaa00" font-weight="bold">S3 · storage-for-travel-map</text>
  <text x="310" y="336" text-anchor="middle" font-family="monospace" font-size="9" fill="#cc9944">web/ ? index.html · css/ · js/ · data/ · photos/</text>
  <text x="310" y="352" text-anchor="middle" font-family="monospace" font-size="9" fill="#cc9944">private bucket · CloudFront origin</text>

  <!-- API Gateway -->
  <rect x="70" y="392" width="200" height="48" rx="8" fill="#00d4aa" fill-opacity="0.12" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="170" y="412" text-anchor="middle" font-family="monospace" font-size="11" fill="#00d4aa" font-weight="bold">API Gateway HTTP</text>
  <text x="170" y="428" text-anchor="middle" font-family="monospace" font-size="9" fill="#66bb99">api-travel-map</text>

  <!-- Arrow API ? Lambda -->
  <line x1="270" y1="416" x2="318" y2="416" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Lambda -->
  <rect x="322" y="392" width="220" height="48" rx="8" fill="#00d4aa" fill-opacity="0.12" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="432" y="412" text-anchor="middle" font-family="monospace" font-size="11" fill="#00d4aa" font-weight="bold">Lambda</text>
  <text x="432" y="428" text-anchor="middle" font-family="monospace" font-size="9" fill="#66bb99">GET /health · GET /tours</text>

  <!-- Browser ? API Gateway (left side path) -->
  <path d="M360,102 C220,102 100,102 100,172 L100,392" fill="none" stroke="#00d4aa" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>
  <text x="78" y="280" text-anchor="middle" font-family="monospace" font-size="9" fill="#00d4aa" transform="rotate(-90 78 280)">/tours · /health</text>

  <!-- ========== External services ========== -->
  <rect x="610" y="172" width="280" height="286" rx="10" fill="#aa88ff" fill-opacity="0.06" stroke="#aa88ff" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="626" y="194" text-anchor="start" font-family="monospace" font-size="12" fill="#aa88ff" font-weight="bold">External Services</text>

  <rect x="630" y="220" width="240" height="52" rx="8" fill="#aa88ff" fill-opacity="0.12" stroke="#aa88ff" stroke-width="1.5"/>
  <text x="750" y="241" text-anchor="middle" font-family="monospace" font-size="11" fill="#ccbbff" font-weight="bold">Esri ArcGIS</text>
  <text x="750" y="258" text-anchor="middle" font-family="monospace" font-size="9" fill="#9988bb">World Imagery · Topo Map</text>

  <rect x="630" y="296" width="240" height="52" rx="8" fill="#aa88ff" fill-opacity="0.12" stroke="#aa88ff" stroke-width="1.5"/>
  <text x="750" y="317" text-anchor="middle" font-family="monospace" font-size="11" fill="#ccbbff" font-weight="bold">AWS Terrain Tiles</text>
  <text x="750" y="334" text-anchor="middle" font-family="monospace" font-size="9" fill="#9988bb">Terrarium DEM (Open Data)</text>

  <rect x="630" y="372" width="240" height="52" rx="8" fill="#aa88ff" fill-opacity="0.12" stroke="#aa88ff" stroke-width="1.5"/>
  <text x="750" y="393" text-anchor="middle" font-family="monospace" font-size="11" fill="#ccbbff" font-weight="bold">Nominatim</text>
  <text x="750" y="410" text-anchor="middle" font-family="monospace" font-size="9" fill="#9988bb">Place search / geocoding</text>

  <!-- Browser ? External -->
  <path d="M560,102 C700,102 750,102 750,172" fill="none" stroke="#aa88ff" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowPurple)"/>
  <text x="790" y="148" text-anchor="start" font-family="monospace" font-size="9" fill="#aa88ff">tiles · geocode</text>

  <!-- ========== Data flow ========== -->
  <rect x="40" y="482" width="840" height="96" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#333" stroke-width="1"/>
  <text x="60" y="506" text-anchor="start" font-family="monospace" font-size="11" fill="#888" font-weight="bold">Data flow</text>
  <text x="60" y="528" text-anchor="start" font-family="monospace" font-size="10" fill="#aaa">1. Browser ? CloudFront ? S3(web/)     static HTML/JS/CSS · GeoJSON · photos</text>
  <text x="60" y="548" text-anchor="start" font-family="monospace" font-size="10" fill="#aaa">2. Browser ? API Gateway ? Lambda      tours GeoJSON (fallback: data/tours.geojson)</text>
  <text x="60" y="568" text-anchor="start" font-family="monospace" font-size="10" fill="#aaa">3. Browser ? Esri / Terrain / Nominatim  satellite · DEM · place search</text>
</svg>
